# Alert Engine Configuration
server:
  host: 0.0.0.0
  port: 8082

kafka:
  brokers:
    - localhost:9092
  topic_metrics: aiops.metrics
  topic_logs: aiops.logs
  topic_alerts: aiops.alerts
  topic_incidents: aiops.incidents
  consumer_group: alert-engine

database:
  driver: sqlite
  dsn: aiops.db

notification:
  dingtalk:
    enabled: false
    webhook: ""
  email:
    enabled: false
    smtp_host: ""
    smtp_port: 587
    from: ""
    password: ""
  webhook:
    enabled: false
    url: ""

log:
  level: info
  format: json
