syntax = "proto3";

package aiops;

option go_package = "aiops/api/proto";

// Common types used across services

message Pagination {
  int32 limit = 1;
  int32 offset = 2;
}

message PageResponse {
  int64 total = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message TimeRange {
  string start = 1;  // RFC3339 or relative (e.g. "1h")
  string end = 2;
}

message HealthResponse {
  string status = 1;   // ok, degraded, error
  string service = 2;
  string version = 3;
  map<string, string> details = 4;
}

message Labels {
  map<string, string> entries = 1;
}
