version: "3.8"

# AIOps Platform - Docker Compose
# Usage: docker compose up -d

services:
  # ──────────────────────────────────────
  # Storage Layer
  # ──────────────────────────────────────

  victoria-metrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: aiops-vm
    ports:
      - "8428:8428"
    volumes:
      - vm-data:/victoria-metrics-data
    command:
      - "--retentionPeriod=30d"
      - "--storageDataPath=/victoria-metrics-data"
      - "--httpListenAddr=:8428"
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: aiops-clickhouse
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # Native
    volumes:
      - ch-data:/var/lib/clickhouse
      - ../clickhouse:/docker-entrypoint-initdb.d
    environment:
      CLICKHOUSE_DB: aiops
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    restart: unless-stopped

  sqlite:
    # SQLite doesn't need a server - just a volume for the file
    image: alpine:3.20
    container_name: aiops-sqlite-init
    volumes:
      - sqlite-data:/data
    command: "true"
    restart: "no"

  # ──────────────────────────────────────
  # Data Pipeline
  # ──────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: aiops-zookeeper
    ports:
      - "2181:2181"
    volumes:
      - zk-data:/var/lib/zookeeper/data
    environment:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: aiops-kafka
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    restart: unless-stopped

  # ──────────────────────────────────────
  # Metrics Collection
  # ──────────────────────────────────────

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: aiops-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    restart: unless-stopped

  vmagent:
    image: victoriametrics/vmagent:v1.106.1
    container_name: aiops-vmagent
    ports:
      - "8429:8429"
    volumes:
      - vmagent-data:/vmagent
      - ./vmagent.yml:/etc/vmagent/config.yml
    command:
      - "--promscrape.config=/etc/vmagent/config.yml"
      - "--remoteWrite.url=http://victoria-metrics:8428/api/v1/write"
      - "--httpListenAddr=:8429"
    depends_on:
      - victoria-metrics
      - node-exporter
    restart: unless-stopped

  # ──────────────────────────────────────
  # Application Services
  # ──────────────────────────────────────

  gateway:
    build:
      context: ../../
      dockerfile: deploy/docker-compose/Dockerfile.go
      args:
        SERVICE_NAME: gateway
    container_name: aiops-gateway
    ports:
      - "8080:8080"
    environment:
      SERVICE_NAME: gateway
      PORT: "8080"
      GIN_MODE: release
      UPSTREAM_QUERY: "http://aiops-query:8081"
      UPSTREAM_ALERT: "http://aiops-alert:8082"
      UPSTREAM_ADMIN: "http://aiops-admin:8083"
      UPSTREAM_COLLECTOR: "http://aiops-collector:8084"
      UPSTREAM_JOB: "http://aiops-job:8085"
      UPSTREAM_ANOMALY: "http://aiops-anomaly:5001"
      UPSTREAM_ALERT_AGG: "http://aiops-alert-agg:5003"
      UPSTREAM_LLM: "http://aiops-llm:5004"
    depends_on:
      - victoria-metrics
      - clickhouse
      - kafka
    restart: unless-stopped

  query-service:
    build:
      context: ../../
      dockerfile: deploy/docker-compose/Dockerfile.go
      args:
        SERVICE_NAME: query
    container_name: aiops-query
    ports:
      - "8081:8081"
    environment:
      SERVICE_NAME: query
      PORT: "8081"
      GIN_MODE: release
    depends_on:
      - victoria-metrics
      - clickhouse
    restart: unless-stopped

  alert-engine:
    build:
      context: ../../
      dockerfile: deploy/docker-compose/Dockerfile.go
      args:
        SERVICE_NAME: alert
    container_name: aiops-alert
    ports:
      - "8082:8082"
    environment:
      SERVICE_NAME: alert
      PORT: "8082"
      GIN_MODE: release
    depends_on:
      - kafka
    restart: unless-stopped

  admin-service:
    build:
      context: ../../
      dockerfile: deploy/docker-compose/Dockerfile.go
      args:
        SERVICE_NAME: admin
    container_name: aiops-admin
    ports:
      - "8083:8083"
    environment:
      SERVICE_NAME: admin
      PORT: "8083"
      GIN_MODE: release
    restart: unless-stopped

  collector-service:
    build:
      context: ../../
      dockerfile: deploy/docker-compose/Dockerfile.go
      args:
        SERVICE_NAME: collector
    container_name: aiops-collector
    ports:
      - "8084:8084"
    environment:
      SERVICE_NAME: collector
      PORT: "8084"
      GIN_MODE: release
    restart: unless-stopped

  job-engine:
    build:
      context: ../../
      dockerfile: deploy/docker-compose/Dockerfile.go
      args:
        SERVICE_NAME: job
    container_name: aiops-job
    ports:
      - "8085:8085"
    environment:
      SERVICE_NAME: job
      PORT: "8085"
      GIN_MODE: release
    restart: unless-stopped

  # ──────────────────────────────────────
  # AI Services (Python)
  # ──────────────────────────────────────

  anomaly-service:
    build:
      context: ../../
      dockerfile: deploy/docker-compose/Dockerfile.python
      args:
        SERVICE_NAME: anomaly
    container_name: aiops-anomaly
    ports:
      - "5001:5001"
    environment:
      SERVICE_NAME: anomaly
      PORT: "5001"
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      - kafka
    restart: unless-stopped

  alert-agg-service:
    build:
      context: ../../
      dockerfile: deploy/docker-compose/Dockerfile.python
      args:
        SERVICE_NAME: alert_agg
    container_name: aiops-alert-agg
    ports:
      - "5003:5003"
    environment:
      SERVICE_NAME: alert_agg
      PORT: "5003"
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      - kafka
    restart: unless-stopped

  llm-service:
    build:
      context: ../../
      dockerfile: deploy/docker-compose/Dockerfile.python
      args:
        SERVICE_NAME: llm
    container_name: aiops-llm
    ports:
      - "5004:5004"
    environment:
      SERVICE_NAME: llm
      PORT: "5004"
    restart: unless-stopped

  # ──────────────────────────────────────
  # Graph Database (NebulaGraph)
  # ──────────────────────────────────────

  nebula-metad:
    image: vesoft/nebula-metad:v3.8.0
    container_name: aiops-nebula-metad
    ports:
      - "9559:9559"
    volumes:
      - nebula-meta:/data
    environment:
      TZ: Asia/Shanghai
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-metad
      - --ws_ip=nebula-metad
    restart: unless-stopped

  nebula-storaged:
    image: vesoft/nebula-storaged:v3.8.0
    container_name: aiops-nebula-storaged
    ports:
      - "9779:9779"
      - "9780:9780"
    volumes:
      - nebula-storage:/data
    environment:
      TZ: Asia/Shanghai
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-storaged
      - --ws_ip=nebula-storaged
    depends_on:
      - nebula-metad
    restart: unless-stopped

  nebula-graphd:
    image: vesoft/nebula-graphd:v3.8.0
    container_name: aiops-nebula-graphd
    ports:
      - "9669:9669"   # NebulaGraph
      - "19669:19669" # HTTP
    environment:
      TZ: Asia/Shanghai
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-graphd
      - --ws_ip=nebula-graphd
    depends_on:
      - nebula-metad
      - nebula-storaged
    restart: unless-stopped

  # ──────────────────────────────────────
  # Frontend
  # ──────────────────────────────────────

  web:
    image: nginx:1.27
    container_name: aiops-web
    ports:
      - "3000:80"
    volumes:
      - ../../web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../deploy/agent:/opt/aiops/agent:ro   # Agent installer
      - ../../bin:/opt/aiops/bin:ro               # Agent binaries
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  vm-data:
  vmagent-data:
  ch-data:
  zk-data:
  kafka-data:
  sqlite-data:
  nebula-meta:
  nebula-storage:
