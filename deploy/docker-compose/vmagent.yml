global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "aiops-services"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "gateway:8080"
          - "query-service:8081"
          - "alert-engine:8082"
          - "admin-service:8083"
          - "collector-service:8084"
          - "job-engine:8085"
